name: Auto Label with Unix Timestamp

on:
  pull_request:
    types: [labeled]

jobs:
  add-timestamp-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    
    steps:
    - name: Add event timestamp label to PR
      uses: actions/github-script@v7
      with:
        script: |
          const unixTimestamp = Math.floor(Date.now() / 1000);
          const eventAction = context.payload.action;
          const prNumber = context.issue.number;
          
          // Get existing labels to check for existing timestamps
          const { data: labels } = await github.rest.issues.listLabelsOnIssue({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber
          });
          
          // Check if there's already a timestamp label
          const hasTimestampLabel = labels.some(label => 
            /-\d+$/.test(label.name)
          );
          
          if (hasTimestampLabel) {
            console.log(`PR #${prNumber} already has timestamp label, skipping`);
            return;
          }
          
          const labelName = `${eventAction}-${unixTimestamp}`;
          
          await github.rest.issues.addLabels({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
            labels: [labelName]
          });
          
          console.log(`Added label: ${labelName} to PR #${prNumber}`);
