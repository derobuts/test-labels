name: Auto Label with Unix Timestamp

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'sync-labels'
        type: choice
        options:
        - sync-labels
        - auto-label-pr
        - cleanup-labels

jobs:
  add-timestamp-label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    
    steps:
    - name: Add Unix timestamp to existing labels
      if: github.event_name != 'workflow_dispatch'
      uses: actions/github-script@v7
      with:
        script: |
          const unixTimestamp = Math.floor(Date.now() / 1000);
          
          // Get current labels on the PR/issue
          const { data: currentIssue } = await github.rest.issues.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number
          });
          
          const currentLabels = currentIssue.labels || [];
          console.log(`Found ${currentLabels.length} existing labels`);
          
          if (currentLabels.length === 0) {
            console.log('No existing labels to timestamp');
            return;
          }
          
          // Create timestamped versions of existing labels
          const timestampedLabels = [];
          
          for (const label of currentLabels) {
            const originalName = label.name;
            const originalColor = label.color;
            const originalDescription = label.description || '';
            
            // Skip if label already has a timestamp (avoid double-timestamping)
            if (originalName.match(/-\d+$/)) {
              console.log(`Skipping already timestamped label: ${originalName}`);
              timestampedLabels.push(originalName);
              continue;
            }
            
            // Create new timestamped label name
            const timestampedName = `${originalName}-${unixTimestamp}`;
            
            // Create the timestamped label in the repository
            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: timestampedName,
                color: originalColor,
                description: `${originalDescription} (timestamped: ${new Date().toISOString()})`
              });
              console.log(`Created timestamped label: ${timestampedName}`);
            } catch (error) {
              // Label might already exist, that's okay
              if (error.status !== 422) {
                console.log(`Error creating label ${timestampedName}: ${error.message}`);
              }
            }
            
            timestampedLabels.push(timestampedName);
          }
          
          // Replace all labels with timestamped versions
          if (timestampedLabels.length > 0) {
            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: timestampedLabels
            });
            
            console.log(`Replaced labels with timestamped versions:`);
            console.log(`Original: ${currentLabels.map(l => l.name).join(', ')}`);
            console.log(`Timestamped: ${timestampedLabels.join(', ')}`);
            console.log(`Unix timestamp: ${unixTimestamp}`);
          }
    
    - name: Add workflow timestamp label
      if: github.event_name == 'workflow_dispatch'
      uses: actions/github-script@v7
      with:
        script: |
          const unixTimestamp = Math.floor(Date.now() / 1000);
          const action = '${{ github.event.inputs.action }}';
          const labelName = `${action}-${unixTimestamp}`;
          
          console.log(`Created workflow label: ${labelName}`);
